name = "sgn-sembako"
main = "src/worker.ts" # login + 2FA di depan API (src/index.ts)
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "0fb0eac92e0637fca3c730b55a2812eb"

# Database Cloudflare D1 (5 GB Gratis)
# Cukup buat database di Cloudflare Dashboard > Storage & Databases > D1 SQL Database > Create "minyakku-d1"
[[d1_databases]]
binding = "DB"
database_name = "minyakku-d1"
database_id = "c5c5d38c-c4d9-401f-929c-0c32940592e2"

# Kirim email kode 2FA lewat Cloudflare Email Service (domain harus sudah di Cloudflare + Email Service)
[[send_email]]
name = "EMAIL"
allowed_destination_addresses = ["adi.satya.ms@gmail.com"]

# Secret untuk login + 2FA (isi dengan: npx wrangler secret put NAMA_SECRET)
#   ADMIN_INITIAL_PASSWORD  password awal admin (dipakai sekali saat login pertama)
#   RESEND_API_KEY          (cadangan, opsional) API key Resend bila tidak pakai binding EMAIL
#   MAIL_FROM               wajib untuk binding EMAIL: alamat pengirim, contoh login@domainanda.com (bisa juga sebagai variabel biasa)
#   AUTH_PEPPER             (opsional) string acak panjang untuk memperkuat hash kode 2FA
# Variabel biasa (opsional): ADMIN_EMAIL, default adi.satya.ms@gmail.com
