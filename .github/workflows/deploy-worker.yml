# .github/workflows/deploy-worker.yml
# Otomatis deploy Cloudflare Worker setiap kali Anda push ke GitHub
name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Workers via Wrangler Latest
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "0fb0eac92e0637fca3c730b55a2812eb"
          wranglerVersion: "latest"
          command: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
